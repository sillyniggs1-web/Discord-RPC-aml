name: Build Discord_RPC AML mod

# Repo layout: just this file and the source zip (Discord_RPC_AML_source.zip) in the repo root.
# The workflow unzips the source and builds it, so to ship a new version you only replace the zip.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ZIP=$(ls Discord_RPC*.zip 2>/dev/null | head -n1)
          [ -n "$ZIP" ] || ZIP=$(ls *.zip 2>/dev/null | head -n1)
          [ -n "$ZIP" ] || { echo "No .zip found in the repo root"; exit 1; }
          echo "Using $ZIP"
          rm -rf work
          mkdir -p work
          unzip -q "$ZIP" -d work
          # the zip may contain one top-level folder instead of the files directly
          if [ ! -f work/CMakeLists.txt ]; then
            F=$(find work -maxdepth 3 -name CMakeLists.txt -not -path '*/__MACOSX/*' | head -n1)
            [ -n "$F" ] || { echo "CMakeLists.txt not found inside $ZIP"; exit 1; }
            D=$(dirname "$F")
            mv "$D" src_root
            rm -rf work
            mv src_root work
          fi
          ls work

      - name: Build native libs (armeabi-v7a + arm64-v8a)
        working-directory: work
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in armeabi-v7a arm64-v8a; do
            cmake -S . -B "build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$ABI" -j
          done

      - name: Build the dex (SDK Java classes + HxBridge)
        working-directory: work
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          mkdir -p build/classes build/dex
          # the SDK's own NativeCalls throws inside the game (needs manifest entries + androidx), so it is
          # replaced by java/com/discord/socialsdk/NativeCalls.java: strip the original from the jar copy
          cp third_party/jars/discord_partner_sdk.jar build/sdk_patched.jar
          zip -q -d build/sdk_patched.jar 'com/discord/socialsdk/NativeCalls*' || true
          javac --release 8 -cp "$PLAT/android.jar:build/sdk_patched.jar:third_party/jars/libwebrtc.jar" \
                -d build/classes java/com/hexed/rpc/HxBridge.java java/com/discord/socialsdk/NativeCalls.java
          jar cf build/hx_classes.jar -C build/classes .
          "$BT/d8" --release --min-api 21 --lib "$PLAT/android.jar" --output build/dex \
                build/sdk_patched.jar third_party/jars/libwebrtc.jar build/hx_classes.jar
          (cd build/dex && zip -q ../hx_dex.jar classes*.dex)
          unzip -l build/hx_dex.jar

      - name: Package
        working-directory: work
        run: |
          for ABI in armeabi-v7a arm64-v8a; do
            D="dist/$ABI"
            mkdir -p "$D/Discord_RPC"
            cp "build/$ABI/libDiscord_RPC.so"                      "$D/"
            cp "build/$ABI/libhxrpc_core.so"                       "$D/Discord_RPC/"
            cp "third_party/lib/$ABI/libdiscord_partner_sdk.so"    "$D/Discord_RPC/"
            cp build/hx_dex.jar                                    "$D/Discord_RPC/"
            cp lua/Discord_RPC.lua                                 "$D/"
          done
          ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: Discord_RPC_AML
          path: work/dist
