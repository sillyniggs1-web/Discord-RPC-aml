name: Build Discord_RPC AML mod

# Repo layout (only these two things):
#   Discord_RPC_AML_v3_source.zip      <- the source zip (any *.zip in the repo root works)
#   .github/workflows/build.yml        <- this file
# Push either one (or press "Run workflow") and the build runs by itself.

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 0) unzip the source, find the project folder (the one holding CMakeLists.txt)
      - name: Unzip source
        run: |
          shopt -s nullglob
          ZIPS=(*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::No .zip found in the repository root. Upload the source zip next to .github/"
            exit 1
          fi
          # newest zip wins if there are several (names sorted, last one used)
          ZIP="${ZIPS[-1]}"
          echo "Using $ZIP"
          rm -rf src_unzipped
          mkdir src_unzipped
          unzip -q "$ZIP" -d src_unzipped
          CM=$(find src_unzipped -name CMakeLists.txt -not -path '*/third_party/*' | head -n1)
          if [ -z "$CM" ]; then
            echo "::error::CMakeLists.txt not found inside $ZIP"
            exit 1
          fi
          PROJ=$(dirname "$CM")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "Project folder: $PROJ"
          ls -la "$PROJ"

      # 1) the dex first: the mod embeds it
      - name: Build the dex (SDK Java classes + HxBridge)
        working-directory: ${{ env.PROJ }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          mkdir -p build/classes build/dex
          javac --release 8 -cp "$PLAT/android.jar:third_party/jars/discord_partner_sdk.jar:third_party/jars/libwebrtc.jar" \
                -d build/classes java/com/hexed/rpc/HxBridge.java
          jar cf build/hx_classes.jar -C build/classes .
          "$BT/d8" --release --min-api 21 --lib "$PLAT/android.jar" --output build/dex \
                third_party/jars/discord_partner_sdk.jar third_party/jars/libwebrtc.jar build/hx_classes.jar
          (cd build/dex && zip -q ../hx_dex.jar classes*.dex)
          unzip -l build/hx_dex.jar

      # 2) native libs. Nezuko is armeabi-v7a; arm64-v8a is built too
      - name: Build native libs
        working-directory: ${{ env.PROJ }}
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in armeabi-v7a arm64-v8a; do
            cmake -S . -B "build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
              -DHX_DEX_JAR="$PWD/build/hx_dex.jar"
            cmake --build "build/$ABI" -j
          done

      # 3) package: compiled .so + Lua per ABI
      - name: Package
        working-directory: ${{ env.PROJ }}
        run: |
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p "dist/$ABI"
            cp "build/$ABI/libDiscord_RPC.so" "dist/$ABI/"
            cp lua/Discord_RPC.lua            "dist/$ABI/"
          done
          ls -lR dist
          echo "DIST=$PWD/dist" >> "$GITHUB_ENV"

      # compiled .so first ...
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Discord_RPC_AML_compiled
          path: ${{ env.DIST }}

      # ... then the uncompiled source
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Discord_RPC_AML_source
          path: ${{ env.ZIP_NAME }}
